name: Experimental Root ePDG APK
on:
  push:
    branches:
      - experimental/root-epdg-tun
      - experimental/cross-sim-calling
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint gettext libtool pkg-config make gcc g++ gperf bison flex perl python3 texinfo unzip xz-utils wget curl patch
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --version
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
      - name: Build ARM64 native libraries
        run: |
          make -C external install-arch-arm64 ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
      - name: Build, unit test and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oconnect-root-epdg-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
